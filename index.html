<style>
:root{--bg:#0f1012;--frame:#efeeea;--gap:clamp(.6rem,1.4vw,1.6rem);--pad:clamp(1rem,4vw,3rem);--b:clamp(4px,.5vw,9px);
  /* Width of the photo row: 87.5% of the window, but never so wide that the row gets taller than 64% of the window height */
  --w:min(87.5vw,calc(210vh + 4 * var(--gap)),calc(100vw - 2 * var(--pad)));--accent:#a99bf0}
*{box-sizing:border-box;margin:0}
html{background:var(--bg)}
body{background:radial-gradient(120% 90% at 50% 38%,#1a1c22 0%,#121317 55%,#0b0c0e 100%) no-repeat;min-height:100svh;display:grid;grid-template-columns:minmax(0,1fr);place-content:center;padding:clamp(1.5rem,5vw,4rem) var(--pad);font-family:system-ui,sans-serif}
.page{display:flex;flex-direction:column;align-items:center;gap:clamp(2rem,5vw,3.5rem)}
:focus-visible{outline:2px solid var(--accent);outline-offset:4px}

/* Logo is black on white, so invert it and let screen blending drop the background */
.logo{flex:none;transform:translateX(5.6%);width:min(34rem,86vw);height:auto;display:block}

/* Social links: small icons under the logo */
.social{display:flex;justify-content:center;gap:.25rem;list-style:none;padding:0;flex:none}
.social a{display:grid;place-items:center;width:44px;height:44px;color:var(--frame);opacity:.6;transition:opacity .2s ease}
.social a:hover,.social a:focus-visible{opacity:1}
.social svg{width:26px;height:26px;display:block}

/* Privacy link */
.legal{flex:none;font:400 .8rem/1 system-ui,sans-serif;color:#a3a6ae;opacity:.7;text-decoration:none;padding:.5rem}
.legal:hover,.legal:focus-visible{opacity:1;text-decoration:underline}

/* Frames keep the banner's proportions (about 2:3) at rest, then the hovered one widens */
.wrap{flex:none;width:min(100%,var(--w))}
.gallery{display:flex;gap:var(--gap);--h:calc((var(--w) - 4 * var(--gap)) / 5 * 32 / 21);height:var(--h)}
.frame{flex:1 1 0px;min-width:0;padding:0;border:var(--b) solid var(--frame);background:var(--frame);
  cursor:zoom-in;overflow:hidden;contain:layout paint;box-shadow:0 22px 40px -22px rgba(0,0,0,.85);
  transition:flex .6s cubic-bezier(.2,.7,.2,1),opacity .45s ease,box-shadow .45s ease}
.frame img{width:100%;height:100%;object-fit:cover;display:block}
@media (hover:hover){
  .gallery:hover .frame:not(:hover):not(:focus-visible){opacity:.5}
  .frame:hover,.frame:focus-visible{box-shadow:0 30px 60px -24px rgba(0,0,0,.95),0 0 0 1px rgba(255,255,255,.04)}
}
/* The hovered frame becomes 3:2 (the shape of the original photos), so the whole picture shows */
.frame:hover,.frame:focus-visible{flex:0 0 calc(1.5 * (var(--h) - 2 * var(--b)) + 2 * var(--b))}

/* Touch screens and narrow windows: no hover, so use a wrapped grid at the same proportions */
@media (max-width:48rem),(hover:none){
  .wrap{width:100%}
  .gallery{height:auto;flex-wrap:wrap;justify-content:center}
  .frame,.gallery:hover .frame:not(:hover){flex:0 0 calc(33.333% - var(--gap) * .67);aspect-ratio:21/32}
  .frame:hover,.frame:focus-visible{flex:0 0 calc(33.333% - var(--gap) * .67)}
}
@media (max-width:30rem){
  .frame,.gallery:hover .frame:not(:hover),.frame:hover,.frame:focus-visible{flex-basis:calc(50% - var(--gap) * .5)}
}

/* Desktop: pin the frames to the middle of the window and the logo to the bottom middle.
   Fixed positioning does not depend on page flow, so it centers the same way in every browser. */
@media (min-width:48.01rem) and (hover:hover) and (min-height:40rem){
  :root{--lw:min(34rem,86vw,56vh)}
  body{display:block;min-height:100vh;overflow:hidden;padding:0}
  .wrap{position:fixed;top:45%;left:50%;transform:translate(-50%,-50%);width:var(--w)}
  .logo{position:fixed;left:50%;top:83%;transform:translate(-44.4%,-50%);width:var(--lw)}
  /* Sits just under the logo (the logo image is 0.258 as tall as it is wide) */
  .social{position:fixed;left:50%;transform:translateX(-50%);top:calc(83% + var(--lw) * .129 + .5rem)}
  .legal{position:fixed;right:1rem;bottom:.75rem}
}

/* Entrance: frames rise in one after another, then the logo and icons fade in */
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
@keyframes fade{from{opacity:0}}
.frame{animation:rise .9s cubic-bezier(.2,.7,.2,1) backwards}
.frame:nth-child(2){animation-delay:.08s}.frame:nth-child(3){animation-delay:.16s}
.frame:nth-child(4){animation-delay:.24s}.frame:nth-child(5){animation-delay:.32s}
.logo{animation:fade 1.2s ease .5s backwards}
.social{animation:fade 1.2s ease .8s backwards}

/* Lightbox */
dialog{border:0;background:transparent;max-width:100vw;max-height:100vh;width:100%;height:100%;padding:0}
dialog::backdrop{background:rgba(5,5,7,.95)}
dialog .stage{display:grid;place-items:center;height:100%;padding:3.5rem 1rem}
dialog img{max-width:calc(100vw - 2rem);max-height:calc(100vh - 7rem);max-height:calc(100dvh - 7rem);width:auto;height:auto;object-fit:contain}
dialog[open]{animation:fade .25s ease}
dialog img{border-radius:2px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
dialog button{position:absolute;background:rgba(255,255,255,.08);border:0;border-radius:50%;width:2.75rem;height:2.75rem;color:#fff;font:400 1.75rem/1 system-ui,sans-serif;cursor:pointer;padding:0 0 .15rem;transition:background .2s ease}
dialog button:hover,dialog button:focus-visible{background:rgba(255,255,255,.2)}
.x{top:1rem;right:1rem}.prev{left:1rem;top:50%;margin-top:-1.375rem}.next{right:1rem;top:50%;margin-top:-1.375rem}
@media (prefers-reduced-motion:reduce){.frame{transition:none;animation:none}.logo,.social,dialog[open]{animation:none}}
</style>

<dialog id="lb" aria-label="Photo viewer">
  <div class="stage"><img alt=""></div>
  <button class="x" aria-label="Close">&times;</button>
  <button class="prev" aria-label="Previous photo">&#8249;</button>
  <button class="next" aria-label="Next photo">&#8250;</button>
</dialog>

<script>
const frames=[...document.querySelectorAll('.frame')], lb=document.getElementById('lb'), big=lb.querySelector('img');
let i=0;
function show(n){i=(n+frames.length)%frames.length;const s=frames[i].querySelector('img');
  big.src=frames[i].dataset.full||s.src;big.alt=s.alt}
frames.forEach((f,n)=>f.addEventListener('click',()=>{show(n);lb.showModal()}));
lb.querySelector('.x').onclick=()=>lb.close();
lb.querySelector('.prev').onclick=()=>show(i-1);
lb.querySelector('.next').onclick=()=>show(i+1);
lb.addEventListener('click',e=>{if(e.target===lb||e.target.classList.contains('stage'))lb.close()});
lb.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')show(i-1);if(e.key==='ArrowRight')show(i+1)});
</script>
